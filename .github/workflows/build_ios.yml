name: Build iOS App - ngebensin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # Step 1: Install CocoaPods dependencies secara manual
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # Step 2: Build langsung lewat xcodebuild (Bypass pengecekan sertifikat Flutter CLI)
      - name: Build iOS Unsigned via Xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Step 3: Kompres folder hasil kompilasi Runner.app
      - name: Compress Build Output
        run: |
          cd build/ios/Build/Products/Release-iphoneos
          zip -r ngebensin-ios.zip Runner.app

      # Step 4: Unggah Artifact ke GitHub
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngebensin-ios-runner
          path: build/ios/Build/Products/Release-iphoneos/ngebensin-ios.zip
          retention-days: 7
