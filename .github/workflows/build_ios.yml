name: Build iOS App - ngebensin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Mengunci versi Flutter agar sama persis dengan PC lokal (3.35.6)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Install Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Update iOS Deployment Target in Podfile
        run: |
          cd ios
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '15.0'/" Podfile || true
          sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/" Podfile || true
          pod install

      - name: Build iOS Unsigned via Xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r ngebensin.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngebensin-ios-runner
          path: ngebensin.ipa
          retention-days: 7
