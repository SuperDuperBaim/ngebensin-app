name: Build iOS App - ngebensin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 1: Download artefak iOS Flutter & ambil dependensi pub
      - name: Precache iOS & Fetch Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      # Step 2: Naikkan versi minimum iOS di Podfile ke 15.0 secara otomatis
      - name: Update iOS Deployment Target in Podfile
        run: |
          cd ios
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '15.0'/" Podfile || true
          sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/" Podfile || true

      # Step 3: Install CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # Step 4: Build aplikasi via Xcodebuild (Bypass Code Signing)
      - name: Build iOS Unsigned via Xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Step 5: Kompres folder hasil kompilasi
      - name: Compress Build Output
        run: |
          cd build/ios/Build/Products/Release-iphoneos
          zip -r ngebensin-ios.zip Runner.app

      # Step 6: Unggah Artifact ke GitHub
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngebensin-ios-runner
          path: build/ios/Build/Products/Release-iphoneos/ngebensin-ios.zip
          retention-days: 7
