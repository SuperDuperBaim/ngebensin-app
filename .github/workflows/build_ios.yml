name: Build iOS App - ngebensin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Tambahkan flag --simulator agar tidak meminta Development Team
      - name: Build iOS Simulator (Unsigned)
        run: flutter build ios --simulator --release

      # Mengompresi file Runner.app dari folder iphonesimulator
      - name: Compress Build Output
        run: |
          cd build/ios/iphonesimulator
          zip -r ngebensin-ios.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngebensin-ios-runner
          path: build/ios/iphonesimulator/ngebensin-ios.zip
          retention-days: 7
