name: Build iOS App - ngebensin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Langkah 1: Jalankan flutter build ios config-only agar struktur xcode project terbentuk
      - name: Prepare iOS Build Target
        run: flutter build ios --release --config-only

      # Langkah 2: Kompilasi langsung lewat xcodebuild tanpa memeriksa signing/development team
      - name: Build iOS Unsigned via Xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Langkah 3: Kompres folder output menjadi file ngebensin-ios.zip
      - name: Compress Build Output
        run: |
          cd build/ios/Build/Products/Release-iphoneos
          zip -r ngebensin-ios.zip Runner.app

      # Langkah 4: Unggah file ngebensin-ios.zip ke Artifacts
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngebensin-ios-runner
          path: build/ios/Build/Products/Release-iphoneos/ngebensin-ios.zip
          retention-days: 7
